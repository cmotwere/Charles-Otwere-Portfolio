<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Charles Otwere Portfolio</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        .offline-container {
            max-width: 500px;
        }
        
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .retry-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            text-decoration: none;
        }
        
        .features-list {
            margin-top: 3rem;
            text-align: left;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        
        .feature-icon {
            margin-right: 1rem;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>
            It looks like you're not connected to the internet. Don't worry! 
            Some features of this portfolio are still available offline.
        </p>
        
        <button class="retry-btn" onclick="window.location.reload()">
            Try Again
        </button>
        
        <div class="features-list">
            <div class="feature-item">
                <div class="feature-icon">📄</div>
                <div>Cached pages are still accessible</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🖼️</div>
                <div>Images and assets are cached</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">📱</div>
                <div>App works offline as installed PWA</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🔄</div>
                <div>Data will sync when connection returns</div>
            </div>
        </div>
    </div>
    
    <script>
        // Check for connectivity and reload if online
        window.addEventListener('online', () => {
            window.location.reload();
        });
        
        // Show network status
        if (navigator.onLine) {
            document.querySelector('.retry-btn').style.display = 'none';
            document.querySelector('p').textContent = 'Connection restored! Reloading page...';
            setTimeout(() => window.location.reload(), 1000);
        }
    </script>
</body>
</html>
